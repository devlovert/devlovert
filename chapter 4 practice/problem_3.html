<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel</title>
    <style>
        /* Travel form — chapter 4 practice */

*,
*::before,
*::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: #1a2b3c;
    background: linear-gradient(160deg, #e8f4fc 0%, #f5f0e8 45%, #eef6f2 100%);
    padding: 2rem 1rem;
}

form {
    max-width: 28rem;
    margin: 0 auto;
    padding: 2rem 1.75rem;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(26, 43, 60, 0.12);
    border: 1px solid rgba(26, 43, 60, 0.06);
}

form > div {
    margin-bottom: 1.25rem;
}

form > div:last-of-type {
    margin-bottom: 0;
    margin-top: 1.5rem;
}

label {
    display: block;
    font-weight: 600;
    font-size: 0.875rem;
    letter-spacing: 0.02em;
    text-transform: capitalize;
    color: #2c4a5e;
    margin-bottom: 0.35rem;
}

input[type="text"],
input[type="tel"],
input[type="email"],
textarea {
    width: 100%;
    padding: 0.65rem 0.85rem;
    font: inherit;
    color: inherit;
    background: #f8fafb;
    border: 1px solid #c5d4dc;
    border-radius: 8px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

input::placeholder {
    color: #8a9aa8;
}

input:hover,
textarea:hover {
    border-color: #9bb4c4;
}

input:focus,
textarea:focus {
    outline: none;
    border-color: #3d8b9e;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(61, 139, 158, 0.2);
}

textarea {
    min-height: 6rem;
    resize: vertical;
}

button[type="submit"] {
    width: 100%;
    padding: 0.75rem 1rem;
    font: inherit;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: capitalize;
    color: #fff;
    background: linear-gradient(135deg, #2d7a8c 0%, #256b7a 100%);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(45, 122, 140, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
}

button[type="submit"]:hover {
    filter: brightness(1.05);
    box-shadow: 0 6px 18px rgba(45, 122, 140, 0.4);
}

button[type="submit"]:active {
    transform: translateY(1px);
}

button[type="submit"]:focus-visible {
    outline: 2px solid #1a5c6b;
    outline-offset: 2px;
}

    </style>
</head>
<body>
    <form action="/submit.php">
        <div>
            <label for="name">name</label>
            <input id="name" type="text" placeholder="enter your name">
        </div>
        <div>
            <label for="age">age</label>
            <input id="age" type="text" placeholder="enter your age">
        </div>
        <div>
            <label for="phone">phone</label>
            <input id="phone" type="tel" placeholder="enter your phone number">
        </div>
        <div>
            <label for="email">email</label>
            <input id="email" type="email" placeholder="enter your email">
        </div>
        <div>
            <label for="add">address</label>
            <textarea name="address" id="add"></textarea>
        </div>
        <div>
        <button type="submit">submit</button>
        </div>
    </form>
</body>
</html>
