<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table for score card</title>
    <style>
        /* Score card table — chapter 4 practice */

*,
*::before,
*::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1rem;
    line-height: 1.5;
    color: #1a1f2e;
    background: linear-gradient(165deg, #e8eef5 0%, #f0ebe3 100%);
    padding: 2rem 1rem;
}

table {
    width: 100%;
    max-width: 36rem;
    margin: 0 auto;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(26, 31, 46, 0.12);
    border: 1px solid rgba(26, 31, 46, 0.08);
}

caption {
    caption-side: top;
    padding: 0 0 0.75rem;
    font-weight: 700;
    font-size: 1.125rem;
    letter-spacing: 0.04em;
    text-transform: capitalize;
    color: #2c3548;
}

thead {
    background: linear-gradient(135deg, #1e3a5f 0%, #152a45 100%);
    color: #f0f4f8;
}

th,
td {
    padding: 0.75rem 1rem;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
}

th {
    font-weight: 600;
    font-size: 0.8125rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

tbody tr:nth-child(even) {
    background: #f7f9fc;
}

tbody tr:hover {
    background: #eef6ff;
}

tbody tr:last-child td {
    border-bottom: none;
}

td:nth-child(2) {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: #1e5c3a;
}

    </style>
</head>
<body>
    <table>
    <caption>scorecard</caption>
    <thead>
        <tr>
            <th>name</th>
            <th>score</th>
            <th>match</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>babar azam</td>
            <td>100</td>
            <td>ind vs pak</td>
        </tr>
        <tr>
            <td>shahid afridi</td>
            <td>100</td>
            <td>eng vs pak</td>
        </tr>
        <tr>
            <td>abdul razzaq</td>
            <td>100</td>
            <td>nz vs pak</td>
        </tr>
    </tbody>
</table>
</body>
</html>
