<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>headings tag</title>
</head>

<body>
    <!-- heading tag is use to make headings in html page in which h1 is the biggest and h6 is the smallest heading -->
    <h1>azeem</h1>
    <h2>azeem</h2>
    <h3>azeem</h3>
    <h4>azeem</h4>
    <h5>azeem</h5>
    <h6>azeem</h6>
</body>

</html>
