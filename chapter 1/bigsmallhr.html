<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>big small hr tag</title>
</head>
<body>
    <!-- this tag is used for big text -->
    <big>i am big</big>
    <!-- this tag is used for small text -->
    <small>i am small</small>
    <!-- this tag is used to make horizontal line under context -->
    <hr>
</body>
</html>
