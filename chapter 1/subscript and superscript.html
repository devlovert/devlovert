<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subscript and superscript tag</title>
</head>
<body>
   <!-- subscript is used to show text lower -->
    <sub>subscript</sub>
    <!-- superscript is used to show text upper -->
    <sup>superscript</sup>
</body>

</html>
