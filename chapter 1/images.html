<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>images</title>
</head>

<body>
  <!-- this tag is use to insert image in html -->
  <img src="" alt="">
  <!-- in src you have to add source code of image like link and name -->
  src=
  <!-- in alt you can add description of image if image is not found -->
  alt=
  <img src="images/developer.png" alt="this is developers image" height="100px" width="100px">
  <br>
  <img src="images/azeem.jfif" alt="this is my image" height="100px" width="100px">
</body>

</html>
