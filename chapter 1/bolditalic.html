<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bold italic underlined</title>
</head>
<body>
    <!-- this tag is used to make text bold -->
    <b>this is bold</b>
<!-- this text is used to make text italic -->
    <i>this is italic</i>
    <!-- this tag is used to make text underlined -->
    <u>this is underlined</u>
</body>
</html>
