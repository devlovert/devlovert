<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables list tags</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 640px;
            margin-top: 1rem;
            font-family: system-ui, sans-serif;
            font-size: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        th,
        td {
            border: 1px solid #c5c9d4;
            padding: 0.65rem 1rem;
            text-align: left;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        thead th {
            background-color: #2c3e50;
            color: #fff;
            font-weight: 600;
        }

        thead th:hover {
            background-color: #34495e;
            cursor: default;
        }

        tbody tr:nth-child(even) {
            background-color: #f4f6f9;
        }

        tbody tr:hover {
            background-color: #dce3f0;
        }

        tbody td:hover {
            background-color: #cfd9ec;
            cursor: cell;
        }
    </style>
</head>

<body>
    <header>
        <h1>table in html</h1>
    </header>
    <table>
        <!-- head of table  -->
        <thead>
            <tr> <!--  table row  -->
                <th>cast</th> <!--  table head -->
                <th>address</th>
                <th>name</th>
            </tr>
        </thead>
        <!-- body of table  -->
        <tbody>
            <tr>
               <td>rajpoot</td>  <!--  table data  -->
                <td>syedwala</td>
                <td>azan</td>
            </tr>
            <tr>
                <td>malik</td>
                <td>jaranwala</td>
                <td>azam</td>
            </tr>
            <tr>
                <td>bhatti</td>
                <td>faislabad</td>
                <td>murad</td>
            </tr>
            <tr>
                <td colspan="1">khan</td>
                <td colspan="2">peshawar</td>
            </tr>
            <tr>
                <td rowspan="1">sahil</td>
                <td rowspan="2">pakistan</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
